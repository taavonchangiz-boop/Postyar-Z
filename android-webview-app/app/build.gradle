plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.belitia.postyar'
    compileSdk 35

    defaultConfig {
        applicationId "ir.belitia.postyar"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"

        // آدرس سامانه — بدون / انتهایی
        buildConfigField "String", "APP_URL", "\"https://belitia.ir\""
        // آدرس ورود مستقیم داشبورد (ردایرکت خودکار به لاگین)
        buildConfigField "String", "DASHBOARD_URL", "\"https://belitia.ir/dashboard\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // نام خروجی APK
    applicationVariants.all { variant ->
        variant.outputs.all {
            def flavor = variant.flavorName
            def buildType = variant.buildType.name
            outputFileName = "postyar-v${variant.versionName}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
