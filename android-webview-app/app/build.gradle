plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.asovin.postyar'
    compileSdk 35

    defaultConfig {
        applicationId "ir.asovin.postyar"
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName "1.3.0"

        buildConfigField "String", "APP_URL", "\"https://asovin.ir\""
        buildConfigField "String", "DASHBOARD_URL", "\"https://asovin.ir/dashboard\""
    }

    signingConfigs {
        release {
            storeFile file('../postyar-release.jks')
            storePassword 'Postyar2024Secure'
            keyAlias 'postyar'
            keyPassword 'Postyar2024Secure'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "postyar-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
